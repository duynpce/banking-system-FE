# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI for react project 

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
      env: 
        VITE_ROOT_API_URL: "${{ secrets.VITE_ROOT_API_URL }}"
        VITE_CLIENT_ID : "${{ secrets.VITE_CLIENT_ID }}"
        VITE_CALLBACK_URL : "${{ secrets.VITE_CALLBACK_URL }}"
        VITE_AUTHORIZE_URL : "${{ secrets.VITE_AUTHORIZE_URL }}"
        VITE_TOKEN_URL : "${{ secrets.VITE_TOKEN_URL }}"
        VITE_ROOT_URL : "${{ secrets.VITE_ROOT_URL }}"
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test -- --run  #because of using vitest
